<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Despesas — Viagem Lisboa 💶</title>
  <meta name="description" content="Regista as despesas da viagem a Lisboa — sem login, para usar no telemóvel durante a viagem." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="viagem.css" />
</head>
<body class="trip-body">

  <!-- Sem propósito: esta página NÃO tem o ecrã de login (auth-gate),
       é um link direto para dar para adicionar despesas sem PIN. -->

  <div class="trip-topbar">
      <a href="viagem.html">← Guia da viagem</a>
      <span class="trip-topbar-title">💶 Despesas</span>
      <a href="index.html">Site principal</a>
  </div>

  <div class="trip-wrap">

      <div class="trip-total-card">
          <div class="trip-total-label">Total gasto</div>
          <div id="expenses-total" class="trip-total-value">0,00 €</div>
      </div>

      <section class="trip-section">
          <h2>Adicionar despesa</h2>
          <div class="expense-form">
              <input type="text" id="expense-desc-input" placeholder="Descrição (ex: bilhetes de autocarro)" maxlength="120" />
              <input type="text" id="expense-valor-input" inputmode="decimal" placeholder="Valor (€)" />
              <select id="expense-categoria-select">
                  <option value="">Categoria (opcional)</option>
                  <option value="comida">🍔 Comida</option>
                  <option value="transporte">🚌 Transporte</option>
                  <option value="atividades">🎟️ Atividades</option>
                  <option value="compras">🛍️ Compras</option>
                  <option value="outro">📦 Outro</option>
              </select>
              <input type="text" id="expense-quem-input" placeholder="Quem gastou? (opcional)" maxlength="60" />
              <button type="button" id="expense-add-btn" class="expense-submit-btn">Adicionar</button>
              <p id="expense-error" class="expense-error"></p>
          </div>
          <p class="trip-sync-hint" id="expenses-sync-hint"></p>
      </section>

      <section class="trip-section">
          <h2>Por categoria</h2>
          <div id="expenses-breakdown" class="expenses-breakdown"></div>
      </section>

      <section class="trip-section">
          <h2>Despesas</h2>
          <div id="expenses-list"></div>
      </section>

  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="viagem-despesas.js"></script>
</body>
</html>
